experimental_monorepo_root = true

[settings]
experimental = true

[tools]
node = "20"
npm = "latest"

[tasks.build]
description = "Builds all services"
depends = ["//...:build"]

[tasks.dev]
description = "Run all services concurrently (bot, API, and frontend)"
depends = ["//...:dev"]

[tasks.generate-api]
description = "Generate TypeScript API client from OpenAPI spec using NSwag"
run = "cd Fitz.Web && npm run generate-api"

[env]
NODE_ENV = "development"
ASPNETCORE_ENVIRONMENT = "Development"